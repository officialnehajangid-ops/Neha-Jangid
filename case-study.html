  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- Favicon -->

</head>
<body>
  <!-- Scroll Progress -->
  <div class="scroll-progress" id="scrollProgress"></div>
  
  <!-- Navigation -->
  <nav class="navigation" id="nav">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">MT.</a>
      
      <div class="nav-links">
        <a href="index.html#work" class="nav-link">Work</a>

        <a href="index.html#contact" class="nav-link">Contact</a>

              <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"></path>

              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>

              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>
      
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
        <svg class="icon-menu" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg class="icon-close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </nav>
  
  <!-- Mobile Menu -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html#work" class="mobile-menu-link">Work</a>
    <a href="index.html#about" class="mobile-menu-link">About</a>

  <main id="caseStudyContent">
    <!-- Content will be populated by JavaScript -->
    <div class="loading">Loading case study...</div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <p>© <span id="year"></span> Michael Tsirakis</p>
      <p>Fueled by iced coffee ☕ <span class="text-primary">·</span> Shipped from Las Vegas</p>
    </div>
  </footer>

  <!-- Scroll to Top Button -->
  <button class="scroll-to-top" id="scrollToTop" aria-label="Scroll to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <!-- Lightbox -->
  <div class="cs-lightbox" id="lightbox">
    <button class="cs-lightbox-close" id="lightboxClose" aria-label="Close lightbox">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <button class="cs-lightbox-nav cs-lightbox-prev" id="lightboxPrev" aria-label="Previous">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>

    <button class="cs-lightbox-nav cs-lightbox-next" id="lightboxNext" aria-label="Next">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 6 15 12 9 18"></polyline>

    </button>
    <div class="cs-lightbox-counter" id="lightboxCounter"></div>

    <div class="cs-lightbox-swipe-hint" id="lightboxSwipeHint">

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

      </div>
    </div>
    
    <img class="cs-lightbox-image" id="lightboxImage" src="" alt="">
    <video class="cs-lightbox-video" id="lightboxVideo" src="" autoplay loop muted playsinline controls style="display: none;"></video>
  </div>

  <script src="case-study-data.js"></script>
  <script src="case-study.js"></script>
  <script src="script.js"></script>
